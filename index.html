<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Absensi SMKS Diponegoro</title>
<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2ff;
    color: #1e293b;
}

header {
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: white;
    padding: 30px;
    text-align: center;
}

header h1 {
    margin: 0;
}

.container {
    max-width: 1000px;
    margin: 30px auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 25px;
    border-radius: 15px;
    box-shadow: 0 5px 20px #00000010;
    margin-bottom: 20px;
}

input, select, button {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 8px;
    border: 1px solid #ddd;
    font-size: 15px;
}

button {
    background: #2563eb;
    color: white;
    border: none;
    cursor: pointer;
    font-weight: bold;
}

button:hover {
    background: #1d4ed8;
}

.stats {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
}

.stat {
    padding: 20px;
    background: white;
    border-radius: 12px;
    text-align: center;
    box-shadow: 0 5px 15px #00000010;
}

.stat h2 {
    color: #2563eb;
    margin-bottom: 5px;
}

table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 15px;
}

th, td {
    padding: 12px;
    border-bottom: 1px solid #eee;
    text-align: left;
}

th {
    background: #eff6ff;
}

.status {
    padding: 5px 10px;
    border-radius: 20px;
    background: #dcfce7;
    color: #166534;
}

.hapus {
    background: #ef4444;
    padding: 8px;
}

@media(max-width:700px) {
    .stats {
        grid-template-columns: repeat(2, 1fr);
    }

    table {
        font-size: 12px;
    }
}
</style>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

<div id="loginAdmin">
    <div class="login-panel">
        <img src="logo.png" alt="Logo sekolah" class="login-logo">
        <span class="login-badge">ADMIN PANEL</span>
        <h2>Selamat Datang</h2>
        <p>Masuk untuk mengelola absensi sekolah</p>

        <input id="username" placeholder="Nama Admin"
               autocomplete="username" autocapitalize="none" value="admin" autofocus>
        <input id="password" type="password" placeholder="Password Admin"
               autocomplete="current-password">
        <button onclick="login()">Masuk ke Dashboard</button>
        <p id="pesan" style="color:red;"></p>

    </div>
</div>

<header>
    <img src="logo.png" alt="Logo SMK Diponegoro Tulakan" class="school-logo">
    <h1>SMKS DIPONEGORO</h1>
    <h2 class="school-subtitle">Sistem Absensi Sekolah</h2>
    <p>Sistem Kehadiran Siswa Digital</p>
    <p id="tanggal"></p>
</header>

<div class="container">

    <div class="stats">
        <div class="stat">
            <h2 id="total">0</h2>
            <p>Total Absen</p>
        </div>

        <div class="stat">
            <h2 id="hadir">0</h2>
            <p>Hadir</p>
        </div>

        <div class="stat">
            <h2 id="izin">0</h2>
            <p>Izin</p>
        </div>

        <div class="stat">
            <h2 id="sakit">0</h2>
            <p>Sakit</p>
        </div>
    </div>

    <div class="card">
        <div class="section-heading">
            <span class="section-icon">+</span>
            <div>
                <h2>Form Absensi</h2>
                <p>Catat kehadiran siswa dengan cepat</p>
            </div>
        </div>

        <form id="formAbsensi">
            <input type="text" id="nama"
                   placeholder="Nama lengkap siswa" required>

            <input type="text" id="kelas"
                   placeholder="Kelas (contoh: XI RPL 1)" required>

            <select id="status">
                <option value="Hadir">Hadir</option>
                <option value="Izin">Izin</option>
                <option value="Sakit">Sakit</option>
                <option value="Alpa">Alpa</option>
            </select>

            <button type="submit">Simpan Absensi</button>
        </form>
    </div>

    <div class="card">
        <div class="section-heading">
            <div>
                <h2>Data Siswa</h2>
            </div>
        </div>

        <div class="rekap-filter">
            <input type="text" id="cari"
                   placeholder="Cari nama siswa..."
                   oninput="tampilkan()">
            <select id="filterStatus" onchange="tampilkan()">
                <option value="">Semua Status</option>
                <option value="Hadir">Hadir</option>
                <option value="Izin">Izin</option>
                <option value="Sakit">Sakit</option>
                <option value="Alpa">Alpa</option>
            </select>
            <input type="date" id="filterTanggal" onchange="tampilkan()">
        </div>

        <div style="overflow-x:auto">
            <table>
                <thead>
                    <tr>
                        <th>No</th>
                        <th>Nama</th>
                        <th>Kelas</th>
                        <th>Status</th>
                        <th>Waktu</th>
                        <th class="admin-action">Aksi</th>
                    </tr>
                </thead>
                <tbody id="dataAbsensi"></tbody>
            </table>
        </div>

        <button class="export-button" onclick="exportCSV()">
            Download Rekap Excel (CSV)
        </button>
    </div>

</div>

<script>
window.SUPABASE_URL = "https://qemdgyydnfmkmntpxtbp.supabase.co";
window.SUPABASE_ANON_KEY = "sb_publishable_GGcvyqmkRwAUu018nVlAzA_2oZNtQhF";

let data = JSON.parse(localStorage.getItem("absensi_lokal") || "[]");
let supabaseClient = null;
let isAdmin = false;

function simpanDataLokal() {
    localStorage.setItem("absensi_lokal", JSON.stringify(data));
}

function configureSupabase() {
    if (!window.supabase) {
        return;
    }

    supabaseClient = window.supabase.createClient(
        window.SUPABASE_URL,
        window.SUPABASE_ANON_KEY
    );
}

configureSupabase();

async function login() {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const pesan = document.getElementById("pesan");

    if (!username || !password) {
        pesan.textContent = "Masukkan username dan password.";
        return;
    }

    if (username === "admin" && (password === "admin123" || password === "admin")) {
        isAdmin = true;
        localStorage.setItem("admin_username", username);
        document.getElementById("loginAdmin").style.display = "none";
        pesan.textContent = "";
        await muatData();
        return;
    }

    pesan.textContent = "Username atau password salah.";
}

document.getElementById("password").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        login();
    }
});

document.getElementById("username").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        document.getElementById("password").focus();
    }
});

document.getElementById("tanggal").textContent =
    new Date().toLocaleDateString("id-ID", {
        weekday: "long",
        year: "numeric",
        month: "long",
        day: "numeric"
    });

document.getElementById("formAbsensi").addEventListener("submit", async function(e) {
    e.preventDefault();

    let nama = document.getElementById("nama").value.trim();
    let kelas = document.getElementById("kelas").value.trim();
    let status = document.getElementById("status").value;

    const waktuSekarang = new Date();
    if (!supabaseClient) {
        data.unshift({
            id: Date.now(),
            nama,
            kelas,
            status,
            waktu: waktuSekarang.toLocaleTimeString("id-ID"),
            tanggal: waktuSekarang.toLocaleDateString("id-ID"),
            tanggalKey: waktuSekarang.toISOString().slice(0, 10)
        });
        simpanDataLokal();
        this.reset();
        muatData();
        alert("Absensi berhasil disimpan!");
        return;
    }

    const { error } = await supabaseClient.from("absensi").insert({
        nama,
        kelas,
        status,
        waktu: waktuSekarang.toLocaleTimeString("id-ID"),
        tanggal: waktuSekarang.toLocaleDateString("id-ID")
    });

    if (error) {
        alert(`Gagal menyimpan: ${error.message}`);
        return;
    }

    this.reset();
    await muatData();
    alert("Absensi berhasil disimpan!");
});

function tampilkan() {
    let tbody = document.getElementById("dataAbsensi");
    let cari = document.getElementById("cari").value.toLowerCase();
    let filterStatus = document.getElementById("filterStatus").value;
    let filterTanggal = document.getElementById("filterTanggal").value;

    tbody.innerHTML = "";

    let hasil = data.filter(d => {
        const cocokNama = d.nama.toLowerCase().includes(cari);
        const cocokStatus = !filterStatus || d.status === filterStatus;
        const cocokTanggal = !filterTanggal || d.tanggalKey === filterTanggal;
        return cocokNama && cocokStatus && cocokTanggal;
    });

    hasil.forEach((d, i) => {
        tbody.innerHTML += `
            <tr>
                <td data-label="No">${i + 1}</td>
                <td data-label="Nama">${d.nama}</td>
                <td data-label="Kelas">${d.kelas}</td>
                <td data-label="Status"><span class="status">${d.status}</span></td>
                <td data-label="Waktu">${d.tanggal} ${d.waktu}</td>
                <td data-label="Aksi" class="admin-action">
                    <button class="hapus" title="Hapus data"
                    onclick="hapus(${data.indexOf(d)})">
                    <span aria-hidden="true">🗑</span>
                    <span class="sr-only">Hapus</span>
                    </button>
                </td>
            </tr>
        `;
    });

    document.getElementById("total").textContent = data.length;
    document.getElementById("hadir").textContent =
        data.filter(d => d.status === "Hadir").length;
    document.getElementById("izin").textContent =
        data.filter(d => d.status === "Izin").length;
    document.getElementById("sakit").textContent =
        data.filter(d => d.status === "Sakit").length;
}

async function hapus(index) {
    if (!isAdmin) {
        return;
    }

    if(confirm("Hapus data absensi ini?")) {
        if (!supabaseClient) {
            data.splice(index, 1);
            simpanDataLokal();
            tampilkan();
            return;
        }

        const { error } = await supabaseClient
            .from("absensi")
            .delete()
            .eq("id", data[index].id);

        if (error) {
            alert(`Gagal menghapus: ${error.message}`);
            return;
        }

        await muatData();
    }
}

function exportCSV() {
    let csv = "Nama,Kelas,Status,Tanggal,Waktu\n";

    data.forEach(d => {
        csv += `${d.nama},${d.kelas},${d.status},${d.tanggal},${d.waktu}\n`;
    });

    let blob = new Blob([csv], {type: "text/csv"});
    let link = document.createElement("a");

    link.href = URL.createObjectURL(blob);
    link.download = "rekap_absensi.csv";
    link.click();
}

async function muatData() {
    if (!supabaseClient) {
        tampilkan();
        return;
    }

    const { data: records, error } = await supabaseClient
        .from("absensi")
        .select("*")
        .order("created_at", { ascending: false });

    if (error) {
        alert(`Gagal memuat data: ${error.message}`);
        return;
    }

    data = records || [];
    tampilkan();
}

tampilkan();

const savedUsername = localStorage.getItem("admin_username");
if (savedUsername) {
    document.getElementById("username").value = savedUsername;
}

</script>

</body>
</html>
